services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tesla_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_tesla_password}
      POSTGRES_DB: tesla_pool
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_recovery:/var/lib/postgresql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tesla_user -d tesla_pool']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    command: ['node', 'backend/scripts/migrate.js']
    environment:
      DATABASE_URL: postgres://tesla_user:${POSTGRES_PASSWORD:-local_tesla_password}@postgres:5432/tesla_pool
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  seed:
    build: .
    command: ['node', 'backend/scripts/seed.js']
    environment:
      DATABASE_URL: postgres://tesla_user:${POSTGRES_PASSWORD:-local_tesla_password}@postgres:5432/tesla_pool
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
  app:
    build: .
    environment:
      PORT: 5000
      DATABASE_URL: postgres://tesla_user:${POSTGRES_PASSWORD:-local_tesla_password}@postgres:5432/tesla_pool
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting}
      ROUTING_BASE_URL: ${ROUTING_BASE_URL:-https://router.project-osrm.org/route/v1/driving}
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 10
volumes:
  postgres_data_recovery:
